version: '3.8'

services:

  # ─── Caddy: proxy reverso com SSL automático ────────────────────────────────
  caddy:
    image: caddy:alpine
    container_name: openclaw-caddy
    restart: unless-stopped
    volumes:
      - /DATA/AppData/openclaw/Caddyfile:/etc/caddy/Caddyfile:ro
      - /DATA/AppData/openclaw/caddy-data:/data
      - /DATA/AppData/openclaw/caddy-config:/config
    networks:
      macvlan-dhcp:
        ipv4_address: 10.41.10.153   # Caddy assume o IP público
      openclaw-internal:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ─── Serviço principal ──────────────────────────────────────────────────────
  openclaw-gateway:
    image: coollabsio/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    depends_on:
      - browser
      - caddy

    environment:
      # HOME apontando para o mesmo volume montado (evita config split)
      HOME: /data
      NODE_ENV: production

      # Modelo de IA
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Gateway
      OPENCLAW_GATEWAY_PORT: 18789
      OPENCLAW_GATEWAY_BIND: loopback
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}

      # Auth da UI (nginx embutido)
      AUTH_USERNAME: admin
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      PORT: 8080

      # Browser sidecar
      BROWSER_CDP_URL: http://browser:9222

      # Canais (opcional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

    volumes:
      - /DATA/AppData/openclaw/config:/data/.openclaw
      - /DATA/AppData/openclaw/workspace:/data/workspace

    # Sem macvlan: acesso externo feito pelo Caddy
    networks:
      openclaw-internal:

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Browser sidecar (Chrome headless CDP) ──────────────────────────────────
  browser:
    image: kasmweb/chrome:1.16.0
    container_name: openclaw-browser
    restart: unless-stopped
    shm_size: '2gb'

    environment:
      VNC_PW: ${AUTH_PASSWORD:-changeme}

    # Sem volume: evita Permission denied (UID interno do kasmweb != host)
    networks:
      openclaw-internal:

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

# ─── Redes ────────────────────────────────────────────────────────────────────
networks:
  macvlan-dhcp:
    external: true          # Rede macvlan existente (só o Caddy expõe IP)
  openclaw-internal:
    driver: bridge          # Comunicação interna entre containers
