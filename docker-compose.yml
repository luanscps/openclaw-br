version: '3.8'

services:
  openclaw-gateway:
    image: openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    
    # Variáveis de ambiente
    environment:
      HOME: /home/openclaw
      NODE_ENV: production
      
      # Modelos de IA (escolha um)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      
      # Gateway config
      OPENCLAW_GATEWAY_PORT: 18789
      OPENCLAW_GATEWAY_BIND: lan
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      
      # Canais (opcional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    
    # Volumes (dados persistem em /DATA/AppData/)
    volumes:
      - /DATA/AppData/openclaw/config:/home/openclaw/.openclaw
      - /DATA/AppData/openclaw/workspace:/home/openclaw/.openclaw/workspace
      - /DATA/AppData/openclaw/credentials:/home/openclaw/.openclaw/credentials
      - /DATA/AppData/openclaw/cache:/home/openclaw/.openclaw/cache
    
    # Rede: sua macvlan-dhcp já existente
    networks:
      macvlan-dhcp:
        ipv4_address: 10.41.10.151
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

# Rede externa (macvlan já criada em seu Portainer)
networks:
  macvlan-dhcp:
    external: true
