version: '3.8'

services:

  # ─── Caddy: proxy reverso com SSL ─────────────────────────────────────────
  caddy:
    image: caddy:alpine
    container_name: openclaw-caddy
    restart: unless-stopped
    volumes:
      - /DATA/AppData/openclaw/Caddyfile:/etc/caddy/Caddyfile:ro
      - /DATA/AppData/openclaw/caddy-data:/data
      - /DATA/AppData/openclaw/caddy-config:/config
    networks:
      macvlan-dhcp:
        ipv4_address: ${SERVER_IP:-10.41.10.153}
      openclaw-internal:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  # ─── Serviço principal ──────────────────────────────────────────────────────
  openclaw-gateway:
    image: coollabsio/openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    depends_on:
      - browser
      - caddy

    environment:
      # HOME apontando para o volume montado (evita config split)
      HOME: /data
      NODE_ENV: production

      # Modelo de IA
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Gateway
      OPENCLAW_GATEWAY_PORT: 18789
      OPENCLAW_GATEWAY_BIND: loopback
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}

      # Auth da UI
      AUTH_USERNAME: admin
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      PORT: 8080

      # Browser sidecar
      BROWSER_CDP_URL: http://browser:9222

      # Segurança: origins e proxies confiáveis (do .env)
      OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS: ${OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS:-https://10.41.10.153}
      OPENCLAW_GATEWAY_TRUSTED_PROXIES: ${OPENCLAW_GATEWAY_TRUSTED_PROXIES:-127.0.0.1}

      # Canais (opcional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

    volumes:
      - /DATA/AppData/openclaw/config:/data/.openclaw
      - /DATA/AppData/openclaw/workspace:/data/workspace

    # Sem macvlan: acesso externo via Caddy
    networks:
      openclaw-internal:

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Browser sidecar (Chrome headless CDP) ─────────────────────────────────
  browser:
    image: kasmweb/chrome:1.16.0
    container_name: openclaw-browser
    restart: unless-stopped
    shm_size: '2gb'

    environment:
      VNC_PW: ${AUTH_PASSWORD:-changeme}

    # Sem volume: evita Permission denied (UID interno do kasmweb != host)
    networks:
      openclaw-internal:

    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

# ─── Redes ────────────────────────────────────────────────────────────────────
networks:
  macvlan-dhcp:
    external: true
  openclaw-internal:
    driver: bridge
